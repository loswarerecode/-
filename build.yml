name: Build OxideESP APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract project zip
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          echo "Found zip: $ZIP"
          unzip -o "$ZIP" -d extracted/
          INNER=$(find extracted -maxdepth 2 -name "build.gradle" | head -1 | xargs dirname)
          echo "Project root: $INNER"
          cp -r "$INNER"/. .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Create gradlew if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OxideESP-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          
